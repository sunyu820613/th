name: webos-player ipk

on:
  push:
    paths: ['webos-player/**', '.github/workflows/webos-player.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install -g @webos-tools/cli
      - run: ares-package app --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: lan-player-ipk
          path: webos-player/dist/*.ipk
